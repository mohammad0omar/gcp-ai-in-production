[project]
name = "pii-safe-inbox"
version = "0.1.0"
description = "Redact support emails with Sensitive Data Protection, then triage them with Gemini."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=3.6",
    "google-cloud-dlp>=3.0",
    "google-cloud-firestore>=2.19",
    "google-auth>=2.30",
    "requests>=2.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
