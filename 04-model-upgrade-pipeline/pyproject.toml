[project]
name = "model-upgrade-pipeline"
version = "0.1.0"
description = "Larkspur Travel: a gated model upgrade pipeline on Cloud Build and Cloud Run"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-genai>=1.0",
  "google-cloud-monitoring>=2.22",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
