[project]
name = "load-test-gemma-vs-gemini"
version = "0.1.0"
description = "Coral Desk: load test Gemma on Cloud Run GPU against Gemini"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6",
    "httpx>=0.27",
    "locust>=2.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
