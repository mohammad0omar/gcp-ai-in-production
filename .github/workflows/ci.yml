name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Check every folder that has tests
        run: |
          failed=""
          for tests in */tests; do
            folder="${tests%/tests}"
            echo "::group::$folder"
            if ! scripts/check_folder.sh "$folder"; then
              failed="$failed $folder"
              echo "::error::$folder failed"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed folders:$failed"
            exit 1
          fi
