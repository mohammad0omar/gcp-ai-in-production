[project]
name = "production-rag-api"
version = "0.1.0"
description = "Brightmoor Legal Library: a production RAG API on Cloud Run, Cloud SQL (pgvector) and Gemini"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
    "cloud-sql-python-connector[pg8000]>=1.18",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "google-auth>=2.30",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
