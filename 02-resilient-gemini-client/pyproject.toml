[project]
name = "resilient-gemini-client"
version = "0.1.0"
description = "Retries, fallback and a hard deadline around Gemini calls on Google Cloud"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
