[project]
name = "ai-cost-attribution"
version = "0.1.0"
description = "Tidewell: cost per customer and per feature for Gemini calls"
requires-python = ">=3.12"
dependencies = ["google-genai>=1.0", "fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "sqlglot>=25",
]

[tool.pytest.ini_options]
pythonpath = ["."]
